<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice-Interactive Training Assistant</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .container { width: 800px; max-width: 95%; background: #1e1e1e; padding: 20px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); text-align: center; }
        video { width: 100%; border-radius: 4px; }
        .controls { margin-top: 15px; display: flex; justify-content: center; gap: 10px; }
        button { background: #007acc; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background: #005999; }
        .status-box { margin-top: 15px; padding: 12px; background: #2d2d2d; border-radius: 4px; border-left: 4px solid #007acc; font-size: 15px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Management & Planning Basics Training</h2>
    <video id="trainingVideo" controls src="class-training.mp4">
        Your browser does not support the video tag.
    </video>
    
    <div class="controls">
        <button id="startVoiceBtn" onclick="startVoiceAssistant()">Start Voice Assistant</button>
    </div>

    <div class="status-box" id="statusBox">
        Click 'Start Voice Assistant', then press play. Say <strong>"Question"</strong> to interrupt.
    </div>
</div>

<script>
    const video = document.getElementById('trainingVideo');
    const statusBox = document.getElementById('statusBox');
    const startVoiceBtn = document.getElementById('startVoiceBtn');

    let recognition;
    let isListening = false;
    let waitingForQuestion = false;
    let accumulatedQuestion = "";

    function speakText(text, callback) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = 1.0;
            utterance.pitch = 1.0;
            utterance.onend = function() {
                if (callback) callback();
            };
            window.speechSynthesis.speak(utterance);
        } else {
            if (callback) callback();
        }
    }

    function startVoiceAssistant() {
        if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
            alert("Speech recognition is not supported in this browser. Please use Google Chrome or Microsoft Edge.");
            return;
        }

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        recognition = new SpeechRecognition();
        recognition.continuous = true;
        recognition.interimResults = false;
        recognition.lang = 'en-US';

        recognition.onstart = function() {
            isListening = true;
            startVoiceBtn.innerText = "Voice Assistant Active (Listening...)";
            startVoiceBtn.style.background = "#28a745";
            statusBox.innerHTML = "Microphone is active. Play the video and say <b>'Question'</b> to interrupt.";
        };

        recognition.onresult = function(event) {
            const transcript = event.results[event.results.length - 1][0].transcript.trim().toLowerCase();
            console.log("Heard:", transcript);

            // Phase 1: Listening for trigger word "question" while video plays
            if (!waitingForQuestion && (transcript.includes("question") || transcript.includes("questions"))) {
                if (!video.paused) {
                    video.pause();
                    waitingForQuestion = true;
                    accumulatedQuestion = "";
                    statusBox.innerHTML = "Interruption detected! Trainer is responding...";
                    
                    speakText("I heard someone wants to ask a question. Go ahead, I am listening.", function() {
                        statusBox.innerHTML = "<b>Listening to your question...</b> Say <b>'Thank you'</b> when you are finished.";
                    });
                }
            } 
            // Phase 2: Actively gathering user question until they say "thank you"
            else if (waitingForQuestion) {
                if (transcript.includes("thank you") || transcript.includes("thanks")) {
                    waitingForQuestion = false;
                    processQuestionAnswer(accumulatedQuestion);
                } else {
                    accumulatedQuestion += " " + transcript;
                    statusBox.innerHTML = "Hearing question: <i>'" + accumulatedQuestion.trim() + "'</i><br>Say <b>'Thank you'</b> when done.";
                }
            }
        };

        recognition.onerror = function(event) {
            console.log("Speech recognition error: ", event.error);
        };

        recognition.onend = function() {
            if (isListening) {
                try {
                    recognition.start();
                } catch(e) {
                    console.log("Recognition restart note: ", e);
                }
            }
        };

        try {
            recognition.start();
        } catch(e) {
            console.log("Already started");
        }
    }

    function processQuestionAnswer(questionText) {
        statusBox.innerHTML = "Processing question: <i>'" + questionText + "'</i>";
        let targetVideo = "class-training.mp4";
        let answerSpoken = "";

        if (questionText.includes("idle") || questionText.includes("cost") || questionText.includes("money") || questionText.includes("wasted")) {
            targetVideo = "idle-response.mp4";
            answerSpoken = "As emphasized in our planning module, idle teams equal lost revenue. Effective operational planning eliminates downtime so crews stay productive.";
        } else if (questionText.includes("schedule") || questionText.includes("timeline") || questionText.includes("delay")) {
            targetVideo = "schedule-response.mp4";
            answerSpoken = "When schedules stall or last-minute changes happen, your entire timeline is impacted. Maintaining real-time visibility prevents these bottlenecks.";
        } else if (questionText.includes("radar") || questionText.includes("dispatch") || questionText.includes("map")) {
            targetVideo = "radar-response.mp4";
            answerSpoken = "The live dispatch radar matches available trade teams by suburb, rating, and immediate availability, cutting down hours of phone calls.";
        } else {
            targetVideo = "class-training.mp4";
            answerSpoken = "That is a vital question regarding your project execution. Structured planning and clear resource allocation are the absolute keys to keeping targets on track.";
        }

        // Switch video and play response
        video.src = targetVideo;
        video.load();
        video.play();

        // Speak answer, pause 2 seconds, say wrap-up phrase, resume main lesson
        speakText(answerSpoken, function() {
            setTimeout(function() {
                speakText("Okay, let's carry on with the lesson.", function() {
                    video.src = "class-training.mp4";
                    video.load();
                    video.play();
                    statusBox.innerHTML = "Resuming training. Say <b>'Question'</b> to interrupt again.";
                });
            }, 2000);
        });
    }
</script>

</body>
</html>
