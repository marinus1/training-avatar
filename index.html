<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice-Interactive Training Assistant</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .container { width: 800px; max-width: 95%; background: #1e1e1e; padding: 20px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); text-align: center; }
        video { width: 100%; border-radius: 4px; background: #000; }
        .controls { margin-top: 15px; display: flex; justify-content: center; gap: 10px; }
        button { background: #007acc; color: white; border: none; padding: 12px 24px; border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: bold; transition: background 0.3s; }
        button:hover { background: #005999; }
        #handBtn { background: #ffc107; color: #000; }
        #handBtn:hover { background: #e0a800; }
        .status-box { margin-top: 15px; padding: 12px; background: #2d2d2d; border-radius: 4px; border-left: 4px solid #007acc; font-size: 15px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Management & Planning Basics Training</h2>
    <video id="trainingVideo" controls src="class-training.mp4">
        Your browser does not support the video tag.
    </video>
    
    <div class="controls">
        <button id="handBtn" onclick="raiseHand()">✋ Raise Hand</button>
    </div>

    <div class="status-box" id="statusBox">
        Press <b>Play</b> on the video. Click <strong>Raise Hand</strong> whenever you want to ask a question.
    </div>
</div>

<script>
    const video = document.getElementById('trainingVideo');
    const statusBox = document.getElementById('statusBox');
    const handBtn = document.getElementById('handBtn');

    let recognition;
    let isListening = false;
    let state = "PLAYING"; 
    let accumulatedQuestion = "";

    function speakText(text, callback) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = 1.0;
            utterance.pitch = 1.0;

            utterance.onend = function() {
                if (callback) callback();
            };
            utterance.onerror = function() {
                if (callback) callback();
            };

            window.speechSynthesis.speak(utterance);
        } else {
            if (callback) callback();
        }
    }

    video.onplay = function() {
        if (!isListening) {
            startVoiceAssistant();
        }
    };

    function startVoiceAssistant() {
        if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
            alert("Speech recognition is not supported in this browser. Please use Google Chrome or Microsoft Edge.");
            return;
        }

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        recognition = new SpeechRecognition();
        recognition.continuous = true;
        recognition.interimResults = false;
        recognition.lang = 'en-US';

        recognition.onstart = function() {
            isListening = true;
        };

        recognition.onresult = function(event) {
            const transcript = event.results[event.results.length - 1][0].transcript.trim().toLowerCase();
            console.log("State:", state, "| Heard:", transcript);

            if (state === "WAITING_FOR_THANKS") {
                if (transcript.includes("thank you") || transcript.includes("thanks")) {
                    state = "ANSWERING";
                    processAndAnswerQuestion(accumulatedQuestion.trim());
                } else {
                    accumulatedQuestion += " " + transcript;
                    statusBox.innerHTML = "Hearing question: <i>'" + accumulatedQuestion.trim() + "'</i><br>Say <b>'Thank you'</b> when finished.";
                }
            }
        };

        recognition.onerror = function(event) {
            console.log("Speech recognition error: ", event.error);
        };

        recognition.onend = function() {
            if (isListening) {
                try {
                    recognition.start();
                } catch(e) {}
            }
        };

        try {
            recognition.start();
        } catch(e) {}
    }

    function raiseHand() {
        if (state !== "PLAYING") return;
        
        video.pause();
        state = "WAITING_FOR_THANKS";
        accumulatedQuestion = "";

        handBtn.innerText = "✋ Hand Raised (Listening...)";
        handBtn.style.background = "#28a745";
        handBtn.style.color = "#fff";

        statusBox.innerHTML = "<b>Hand raised!</b> Trainer is responding...";

        speakText("I see someone wants to ask a question, go ahead.", function() {
            statusBox.innerHTML = "<b>Listening to your question...</b> Speak now, then say <b>'Thank you'</b> when done.";
        });
    }

    function playVideoClip(filename, onReadyCallback) {
        video.muted = true;
        video.src = filename;
        video.load();
        
        video.onloadeddata = function() {
            video.play().then(() => {
                if (onReadyCallback) onReadyCallback();
            }).catch(e => console.log("Play error:", e));
        };
        
        video.onerror = function() {
            statusBox.innerHTML = "<b>Notice:</b> File <code>" + filename + "</code> not found on GitHub. Playing main video.";
            console.log("Missing video file: " + filename);
            video.src = "class-training.mp4";
            video.load();
            video.play();
            if (onReadyCallback) onReadyCallback();
        };
    }

    function processAndAnswerQuestion(questionText) {
        statusBox.innerHTML = "Answering question...";
        let targetVideo = "class-training.mp4";
        let answerSpoken = "";

        if (questionText.includes("idle") || questionText.includes("cost") || questionText.includes("money") || questionText.includes("wasted")) {
            targetVideo = "idle-response.mp4";
            answerSpoken = "As emphasized in our planning module, idle teams equal lost revenue. Effective operational planning eliminates downtime so crews stay productive.";
        } else if (questionText.includes("schedule") || questionText.includes("timeline") || questionText.includes("delay")) {
            targetVideo = "schedule-response.mp4";
            answerSpoken = "When schedules stall or last-minute changes happen, your entire timeline is impacted. Maintaining real-time visibility prevents these bottlenecks.";
        } else if (questionText.includes("radar") || questionText.includes("dispatch") || questionText.includes("map")) {
            targetVideo = "radar-response.mp4";
            answerSpoken = "The live dispatch radar matches available trade teams by suburb, rating, and immediate availability, cutting down hours of phone calls.";
        } else {
            targetVideo = "class-training.mp4";
            answerSpoken = "That is a vital question regarding your project execution. Structured planning and clear resource allocation are the absolute keys to keeping targets on track.";
        }

        playVideoClip(targetVideo, function() {
            speakText(answerSpoken, function() {
                handBtn.innerText = "✋ Raise Hand";
                handBtn.style.background = "#ffc107";
                handBtn.style.color = "#000";

                speakText("Okay, let's carry on with the lesson.", function() {
                    video.muted = false;
                    playVideoClip("class-training.mp4", function() {
                        state = "PLAYING";
                        statusBox.innerHTML = "Training resumed. Click <b>Raise Hand</b> to ask another question.";
                    });
                });
            });
        });
    }
</script>

</body>
</html>
