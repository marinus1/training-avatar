<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice-Interactive Training Assistant</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .container { width: 800px; max-width: 95%; background: #1e1e1e; padding: 20px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); text-align: center; }
        video { width: 100%; border-radius: 4px; }
        .status-box { margin-top: 15px; padding: 12px; background: #2d2d2d; border-radius: 4px; border-left: 4px solid #007acc; font-size: 15px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Management & Planning Basics Training</h2>
    <video id="trainingVideo" controls src="class-training.mp4">
        Your browser does not support the video tag.
    </video>

    <div class="status-box" id="statusBox">
        Press <b>Play</b> on the video to begin. Say <strong>"Question"</strong> at any time to interrupt.
    </div>
</div>

<script>
    const video = document.getElementById('trainingVideo');
    const statusBox = document.getElementById('statusBox');

    let recognition;
    let isListening = false;
    let state = "PLAYING"; 
    let accumulatedQuestion = "";

    function speakText(text, callback) {
        if ('speechSynthesis' in window) {
            // Fix for Chrome speech synthesis freeze bug
            window.speechSynthesis.resume();
            
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = 0.95;
            utterance.pitch = 0.95;
            
            const voices = window.speechSynthesis.getVoices();
            if (voices.length > 0) {
                let selectedVoice = voices.find(v => v.lang.includes('en') && (v.name.includes('Natural') || v.name.includes('Google') || v.name.includes('David') || v.name.includes('James')));
                if (selectedVoice) utterance.voice = selectedVoice;
            }

            utterance.onend = function() {
                if (callback) callback();
            };
            utterance.onerror = function() {
                if (callback) callback();
            };

            window.speechSynthesis.speak(utterance);
        } else {
            if (callback) callback();
        }
    }

    video.onplay = function() {
        if (!isListening) {
            startVoiceAssistant();
        }
    };

    function startVoiceAssistant() {
        if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
            alert("Speech recognition is not supported in this browser. Please use Google Chrome or Microsoft Edge.");
            return;
        }

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        recognition = new SpeechRecognition();
        recognition.continuous = true;
        recognition.interimResults = false;
        recognition.lang = 'en-US';

        recognition.onstart = function() {
            isListening = true;
            statusBox.innerHTML = "Voice assistant active. Say <b>'Question'</b> to interrupt.";
            statusBox.style.borderLeftColor = "#28a745";
        };

        recognition.onresult = function(event) {
            const transcript = event.results[event.results.length - 1][0].transcript.trim().toLowerCase();
            console.log("State:", state, "| Heard:", transcript);

            if (state === "PLAYING" && (transcript.includes("question") || transcript.includes("questions") || transcript.includes("qiestion"))) {
                if (!video.paused) {
                    video.pause();
                    state = "LISTENING_QUESTION";
                    accumulatedQuestion = "";
                    statusBox.innerHTML = "<b>Trainer is listening...</b> Speak your question.";
                    
                    // Force the spoken response instantly
                    speakText("Go ahead, I am listening.");
                }
            } 
            else if (state === "LISTENING_QUESTION") {
                accumulatedQuestion += " " + transcript;
                statusBox.innerHTML = "Hearing question: <i>'" + accumulatedQuestion.trim() + "'</i>";
                
                clearTimeout(window.questionTimer);
                window.questionTimer = setTimeout(() => {
                    if (state === "LISTENING_QUESTION") {
                        state = "ANSWERING";
                        processAndAnswerQuestion(accumulatedQuestion.trim());
                    }
                }, 1500);
            }
            else if (state === "WAITING_THANKYOU") {
                if (transcript.includes("thank you") || transcript.includes("thanks")) {
                    state = "PLAYING";
                    statusBox.innerHTML = "Resuming training. Say <b>'Question'</b> to interrupt again.";
                    speakText("Okay, let's carry on with the lesson.", function() {
                        video.src = "class-training.mp4";
                        video.load();
                        video.play();
                    });
                }
            }
        };

        recognition.onerror = function(event) {
            console.log("Speech recognition error: ", event.error);
        };

        recognition.onend = function() {
            if (isListening) {
                try {
                    recognition.start();
                } catch(e) {}
            }
        };

        try {
            recognition.start();
        } catch(e) {}
    }

    function processAndAnswerQuestion(questionText) {
        statusBox.innerHTML = "Answering question...";
        let targetVideo = "class-training.mp4";
        let answerSpoken = "";

        if (questionText.includes("idle") || questionText.includes("cost") || questionText.includes("money") || questionText.includes("wasted")) {
            targetVideo = "idle-response.mp4";
            answerSpoken = "As emphasized in our planning module, idle teams equal lost revenue. Effective operational planning eliminates downtime so crews stay productive.";
        } else if (questionText.includes("schedule") || questionText.includes("timeline") || questionText.includes("delay")) {
            targetVideo = "schedule-response.mp4";
            answerSpoken = "When schedules stall or last-minute changes happen, your entire timeline is impacted. Maintaining real-time visibility prevents these bottlenecks.";
        } else if (questionText.includes("radar") || questionText.includes("dispatch") || questionText.includes("map")) {
            targetVideo = "radar-response.mp4";
            answerSpoken = "The live dispatch radar matches available trade teams by suburb, rating, and immediate availability, cutting down hours of phone calls.";
        } else {
            targetVideo = "class-training.mp4";
            answerSpoken = "That is a vital question regarding your project execution. Structured planning and clear resource allocation are the absolute keys to keeping targets on track.";
        }

        video.src = targetVideo;
        video.load();
        video.play();

        speakText(answerSpoken, function() {
            state = "WAITING_THANKYOU";
            statusBox.innerHTML = "Answer complete. Say <b>'Thank you'</b> when you are ready to resume.";
        });
    }

    if ('speechSynthesis' in window) {
        window.speechSynthesis.onvoiceschanged = function() {};
    }
</script>

</body>
</html>
