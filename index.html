
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Training Assistant - Planning Basics & Management</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .container { width: 800px; max-width: 95%; background: #1e1e1e; padding: 20px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        video { width: 100%; border-radius: 4px; }
        .controls { margin-top: 15px; display: flex; gap: 10px; }
        button { background: #007acc; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background: #005999; }
        .qa-box { margin-top: 15px; display: none; flex-direction: column; gap: 10px; }
        textarea { width: 100%; height: 80px; background: #2d2d2d; color: #fff; border: 1px solid #444; padding: 10px; border-radius: 4px; resize: none; }
        .response-box { background: #2d2d2d; padding: 15px; border-radius: 4px; margin-top: 10px; border-left: 4px solid #007acc; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>Management & Planning Basics Training</h2>
    <video id="trainingVideo" controls src="class-training.mp4">
        Your browser does not support the video tag.
    </video>
    
    <div class="controls">
        <button id="pauseAskBtn" onclick="togglePauseAndAsk()">Pause & Ask Facilitator</button>
    </div>

    <div class="qa-box" id="qaBox">
        <label for="userQuestion">Ask a question about planning basics, management, or team scheduling:</label>
        <textarea id="userQuestion" placeholder="Type your question here..."></textarea>
        <button onclick="submitQuestion()">Submit Question</button>
    </div>

    <div class="response-box" id="responseBox">
        <strong>Facilitator's Response:</strong>
        <p id="answerText"></p>
    </div>
</div>

<script>
    const video = document.getElementById('trainingVideo');
    const qaBox = document.getElementById('qaBox');
    const responseBox = document.getElementById('responseBox');
    const answerText = document.getElementById('answerText');
    const userQuestion = document.getElementById('userQuestion');

    function togglePauseAndAsk() {
        if (!video.paused) {
            video.pause();
            document.getElementById('pauseAskBtn').innerText = "Resume Training";
            qaBox.style.display = "flex";
        } else {
            video.play();
            document.getElementById('pauseAskBtn').innerText = "Pause & Ask Facilitator";
            qaBox.style.display = "none";
            responseBox.style.display = "none";
            if(!video.src.includes("class-training.mp4")) {
                video.src = "class-training.mp4";
                video.load();
            }
        }
    }

    function submitQuestion() {
        const question = userQuestion.value.trim().toLowerCase();
        if (!question) return;

        responseBox.style.display = "block";
        let targetVideo = "class-training.mp4";

        if (question.includes("idle") || question.includes("cost") || question.includes("money") || question.includes("wasted")) {
            targetVideo = "idle-response.mp4";
            answerText.innerHTML = "As emphasized in our planning module, idle teams equal lost revenue. Effective operational planning eliminates downtime so crews stay productive.";
        } else if (question.includes("schedule") || question.includes("timeline") || question.includes("delay")) {
            targetVideo = "schedule-response.mp4";
            answerText.innerHTML = "When schedules stall or last-minute changes happen, your entire timeline is impacted. Maintaining real-time visibility prevents these bottlenecks.";
        } else if (question.includes("radar") || question.includes("dispatch") || question.includes("map")) {
            targetVideo = "radar-response.mp4";
            answerText.innerHTML = "The live dispatch radar matches available trade teams by suburb, rating, and immediate availability, cutting down hours of phone calls.";
        } else {
            targetVideo = "class-training.mp4";
            answerText.innerHTML = "That's a vital question regarding '" + userQuestion.value + "'. In planning basics and management, structured execution and clear resource allocation are the keys to keeping projects on target.";
        }
        
        // Directly update video source attribute
        video.src = targetVideo;
        video.load();
        video.play().catch(error => {
            console.log("Playback error: ", error);
        });

        userQuestion.value = "";
    }
</script>

</body>
</html>
